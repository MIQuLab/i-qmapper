[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "i-qmapper"
version = "0.1.0"
description = "Interactive, noise-aware QPU layout mapper for Jupyter Lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kenneth M. Merz Jr", email = "kmerz1@gmail.com" },
    { name = "Milana Bazayeva", email = "m.bazayeva@gmail.com" },
]
keywords = ["quantum", "qiskit", "qpu", "layout", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.23",
    "plotly>=5.13",
    "ipywidgets>=8.0",
    "ipython>=8.0",
    "anywidget>=0.9",
    "qiskit-ibm-runtime>=0.20",
    "qiskit>=1.0",
    "rustworkx>=0.13",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
benchmark = ["qiskit-experiments>=0.12"]
png = ["kaleido"]
timelapse = ["imageio", "imageio-ffmpeg"]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/MIQuLab/i-qmapper"
Issues = "https://github.com/MIQuLab/i-qmapper/issues"
Changelog = "https://github.com/MIQuLab/i-qmapper/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2606.27508"

[tool.pytest.ini_options]
markers = [
    "integration: exercises real qiskit-experiments objects against a local fake backend (no network, no QPU); skipped when the optional stack is absent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["iqmapper", "iqmapper.*"]
