[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qpu-mapper"
version = "0.1.0"
description = "Interactive, noise-aware QPU layout mapper for Jupyter Lab"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kenneth M. Merz Jr", email = "kmerz1@gmail.com", email = "merzk@ccf.org" }
    { name = "Milana Bazayeva", email = "m.bazayeva@gmail.com", email = "bazayem@ccf.org" },
]
keywords = ["quantum", "qiskit", "qpu", "layout", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
]
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.23",
    "plotly>=5.13",
    "ipywidgets>=8.0",
    "ipython>=8.0",
    "anywidget>=0.9",
    "qiskit-ibm-runtime>=0.20",
    "qiskit>=1.0",
    "rustworkx>=0.13",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
png = ["kaleido"]
timelapse = ["imageio", "imageio-ffmpeg"]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/mbazayeva/qpu_mapper"
Issues = "https://github.com/mbazayeva/qpu_mapper/issues"
Changelog = "https://github.com/mbazayeva/qpu_mapper/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2606.27508"

[tool.setuptools.packages.find]
where = ["."]
include = ["qpu_mapper", "qpu_mapper.*"]
